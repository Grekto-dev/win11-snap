# win11-snapd user configuration
# Default path: ~/.config/win11-snap/config.ini

[general]
# UI language for settings: en (default) or pt_BR
language = en
# Delay hovering over Maximize before showing the Snap Layouts popup (ms)
hover_delay_ms = 450
# Grace delay before closing after cursor leaves both button, corridor and popup (ms)
dismiss_grace_ms = 180
# Minimum interval between pointer checks during active mouse motion (ms)
motion_throttle_ms = 30
# Gap between snapped windows and screen edges (px, 0 = flush Windows 11 style)
gap_px = 0
# Primary split ratio for the asymmetric 2-column layout (default 70/30)
ratio_split = 0.70
# Enable automatic Windows 11 fallback geometry (46x34 top-right) for any custom frameless window
fallback_custom_csd = true
# Visually replace non-Win11 custom CSD buttons (Electron/Chrome circles) with native X11 Win11 buttons
decorate_custom_csd = true
# Enable Windows 11 native Super + Z shortcut (and keys 1..6 while popup is open)
hotkey_super_z = true
# Enable Windows 11 drag-to-edge/corner Snap + Snap Assist
drag_snap = true
# Show Windows 11 Top Snap Bar when dragging a window to the top center of the screen
top_snap_bar = true
# Enable global Snap keyboard shortcuts configured in [shortcuts]
enable_shortcuts = true
# Enable smooth phantom zone hover preview and snap morph animations (60 FPS, 0% idle CPU)
enable_animations = true
# Enable Windows 11 Snap Assist (frosted acrylic panels + candidate window thumbnails in remaining zones)
enable_snap_assist = true
# Optional comma-separated lowercase WM_CLASS names to ignore
ignore_wm_classes =
# Optional explicit theme path; leave empty to auto-detect from gsettings gtk-theme
theme_geometry_file =

[shortcuts]
# Windows 11 default Snap & Window Management shortcuts (editable via win11-snap-settings)
snap_layouts = <Super>z
snap_left = <Super>Left
snap_right = <Super>Right
snap_up = <Super>Up
snap_down = <Super>Down
snap_top_half = <Super><Alt>Up
snap_bottom_half = <Super><Alt>Down

[custom_csd]
# Default fallback geometry for unprofiled custom-CSD / frameless windows
button_width = 46
button_height = 34
button_gap = 0
right_offset = 0
top_offset = 0

[popup]
# ARGB hex colors (#RRGGBB or #RRGGBBAA), calibrated to Windows 11 Dark Mode
card_bg = #222224F5
card_border = #FFFFFF24
zone_bg = #FFFFFF26
zone_border = #FFFFFF59
zone_hover_bg = #1F9EDEE8
zone_hover_border = #60CDFFFF
card_radius = 8
zone_radius = 4
padding = 14
thumb_width = 76
thumb_height = 48
thumb_gap = 12
cell_gap = 4
anchor_gap = 6

# ============================================================================
# Pre-calibrated profiles for custom client-side titlebars (Electron/Qt/Chrome)
# overlay_buttons = true replaces the app's own buttons with Windows 11 buttons.
# ============================================================================

