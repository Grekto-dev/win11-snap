# Geometry contract between Mint-Y-Dark-Aqua-Win11 theme and win11-snapd.
# All values are in logical pixels at 96 DPI (1x scale) as empirically measured
# against Cinnamon 6.6.9 / Muffin 6.6.3 on X11.

[theme]
name = Mint-Y-Dark-Aqua-Win11
variant = dark
button_layout = :minimize,maximize,close

[ssd]
button_width = 46
button_height = 32
button_gap = 6
right_offset = 0
top_offset = 0

[csd_gtk3]
button_width = 46
button_height = 46
button_gap = 0
right_offset = 0
top_offset = 0

[csd_gtk4]
button_width = 46
button_height = 32
button_gap = 0
right_offset = 0
top_offset = 0
